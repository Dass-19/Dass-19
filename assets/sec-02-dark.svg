      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <text class="pulse" x="20" y="29" font-size="22" font-weight="600" fill="#6c91bc" letter-spacing="1">02</text>
  <text x="64" y="26" font-size="11" font-weight="600" fill="#e6edf3" letter-spacing="3.2">SELECTED WORKS</text>
  <line x1="275" y1="22" x2="725" y2="22" stroke="#262e3a" stroke-width="0.75"/>
  <text x="860" y="26" text-anchor="end" font-size="10" fill="#606a76" letter-spacing="0.8">~/02-selected-works</text>
</svg>
