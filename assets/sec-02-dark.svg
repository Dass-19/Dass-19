<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 42" width="880" height="42" role="img" aria-label="02 SELECTED WORKS" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <style>
      .pulse { animation: numGlow 4s ease-in-out infinite; }
      @keyframes numGlow {
