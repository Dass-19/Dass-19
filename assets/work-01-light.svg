<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 106" width="880" height="106" role="img" aria-label="DASS-AOS — Agent Operating System" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <style>
      .bar-glow { animation: cardPulse 4.6s ease-in-out infinite 0.00s; }
      @keyframes cardPulse {
        0%, 100% { opacity: 0.55; }
        30%      { opacity: 1.00; }
        60%      { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) { .bar-glow { animation: none; } }
    </style>
  </defs>

  <rect class="bar-glow" x="20" y="18" width="3" height="68" rx="1.5" fill="#9e7830"/>
  <text x="38" y="33" font-size="11" font-weight="600" fill="#9e7830" letter-spacing="1.2">01</text>
  <text x="70" y="33" font-size="14" font-weight="600" fill="#1f2328" letter-spacing="0.2">DASS-AOS — Agent Operating System</text>
  <rect x="781.5" y="19" width="74.5" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="818.8" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">ai-agents</text>
  <rect x="701.0" y="19" width="74.5" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="738.2" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">zero-deps</text>
  <rect x="649.0" y="19" width="46.0" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="672.0" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">tui</text>
  <rect x="588.0" y="19" width="55.0" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="615.5" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">python</text>
  <text x="70" y="56" font-size="10.8" fill="#57606a" letter-spacing="0.15">Persistent memory, verifiable contracts, and a real-time terminal command center</text>
  <text x="70" y="73" font-size="10.8" fill="#57606a" letter-spacing="0.15">for steering AI coding agents without losing architectural control of a project.</text>
  <text x="856" y="88" text-anchor="end" font-size="9.2" fill="#76808a" letter-spacing="0.5">dass-aos ↗</text>
  <line x1="20" y1="104" x2="860" y2="104" stroke="#e5e9ef" stroke-width="0.75"/>
</svg>
