    <rect x="17" y="110" width="10" height="10"/>
    <rect x="527" y="110" width="10" height="10"/>
    <rect x="22" y="120" width="500" height="10"/>

    </g>
    <g clip-path="url(#emblem-clip)">
      <polygon class="sheen" points="60,0 130,0 75,140 5,140" fill="url(#sheen-grad)"/>
    </g>
  </g>

  <!-- Editorial Monospace Tagline -->
  <text x="440" y="170" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3" letter-spacing="0.4">
    Building <tspan fill="#d4a957">my dreams</tspan>, building <tspan fill="#6c91bc">a history.</tspan><tspan class="cursor" fill="#d4a957">_</tspan>
  </text>

  <text x="440" y="198" text-anchor="middle" font-size="11.2" fill="#8b949e" letter-spacing="0.45">
