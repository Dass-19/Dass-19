<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 106" width="880" height="106" role="img" aria-label="AgentMVP — Grounded Healthcare RAG" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <style>
      .bar-glow { animation: cardPulse 4.6s ease-in-out infinite 1.35s; }
