        0%, 100% { opacity: 0.55; }
        30%      { opacity: 1.00; }
        60%      { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) { .bar-glow { animation: none; } }
    </style>
  </defs>

  <rect class="bar-glow" x="20" y="18" width="3" height="68" rx="1.5" fill="#4d5650"/>
