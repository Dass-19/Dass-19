  <text x="70" y="33" font-size="14" font-weight="600" fill="#1f2328" letter-spacing="0.2">AgentMVP — Grounded Healthcare RAG</text>
  <rect x="794.5" y="19" width="61.5" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="825.2" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">fastapi</text>
  <rect x="727.0" y="19" width="61.5" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="757.8" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">llama-3</text>
  <rect x="653.0" y="19" width="68.0" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="687.0" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">pgvector</text>
  <rect x="572.5" y="19" width="74.5" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="609.8" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">langgraph</text>
  <text x="70" y="56" font-size="10.8" fill="#57606a" letter-spacing="0.15">Multi-turn clinical assistant backend powered by LangGraph &amp; Supabase pgvector,</text>
  <text x="70" y="73" font-size="10.8" fill="#57606a" letter-spacing="0.15">delivering semantic retrieval and grounded responses with cited medical sources.</text>
