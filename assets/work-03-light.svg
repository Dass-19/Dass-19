<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 106" width="880" height="106" role="img" aria-label="LongoApp — Speech-to-Kichwa Translator" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <style>
      .bar-glow { animation: cardPulse 4.6s ease-in-out infinite 0.90s; }
      @keyframes cardPulse {
        0%, 100% { opacity: 0.55; }
        30%      { opacity: 1.00; }
        60%      { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) { .bar-glow { animation: none; } }
    </style>
  </defs>

  <rect class="bar-glow" x="20" y="18" width="3" height="68" rx="1.5" fill="#7c3b3b"/>
  <text x="38" y="33" font-size="11" font-weight="600" fill="#7c3b3b" letter-spacing="1.2">03</text>
  <text x="70" y="33" font-size="14" font-weight="600" fill="#1f2328" letter-spacing="0.2">LongoApp — Speech-to-Kichwa Translator</text>
  <rect x="810.0" y="19" width="46.0" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="833.0" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">gcp</text>
  <rect x="749.0" y="19" width="55.0" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="776.5" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">docker</text>
  <rect x="675.0" y="19" width="68.0" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="709.0" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">nllb-200</text>
  <rect x="607.5" y="19" width="61.5" height="18" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.6"/><text x="638.2" y="31" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.3">whisper</text>
  <text x="70" y="56" font-size="10.8" fill="#57606a" letter-spacing="0.15">Multilingual multimedia ASR &amp; neural machine translation from Spanish/English</text>
  <text x="70" y="73" font-size="10.8" fill="#57606a" letter-spacing="0.15">directly into Ecuadorian Kichwa, served via FastAPI on GCP and Vercel.</text>
  <text x="856" y="88" text-anchor="end" font-size="9.2" fill="#76808a" letter-spacing="0.5">longoApp ↗</text>
  <line x1="20" y1="104" x2="860" y2="104" stroke="#e5e9ef" stroke-width="0.75"/>
</svg>
